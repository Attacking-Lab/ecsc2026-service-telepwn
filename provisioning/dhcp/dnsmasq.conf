# Provisioning DHCP for the phone fleet.
# Interface, leasefile, script, log and pidfile are passed on the command line
# by up.sh so this file stays host-agnostic (laptop today, Pi later).

# DHCP only -- do not run a DNS resolver (avoids clashing with the host's).
port=0

# Only ever serve DHCP on the interface up.sh whitelists; never leak onto
# other NICs (e.g. the 192.168.69.0/24 dev LAN).
bind-interfaces
except-interface=lo

# Dynamic pool sized for the fleet (~50 phones) on a dedicated subnet.
# Laptop bench uses 10.42.1.0/24 so it never collides with the Pi's 10.42.0.0/24.
dhcp-range=10.42.1.50,10.42.1.240,255.255.255.0,1h

# Self-contained bench: no gateway (option 3) and no DNS (option 6) handed out.
# The provisioning server is on-link, so phones reach it without a router.
dhcp-option=3
dhcp-option=6

dhcp-authoritative
log-dhcp

# bench reservation: our phone -> stable IP
dhcp-host=80:5e:c0:55:dd:8f,10.42.1.153

[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { "path" = "../shared" }
anyhow = { version = "1.0.104", features = ["backtrace"] }
byteorder = "1.5.0"
embedded-graphics = "0.8.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
bytemuck = { version = "1.25.2", features = ["extern_crate_alloc"] }
const_format = "0.2.36"
chrono = "0.4.45"

[target.'cfg(target_arch = "x86_64")'.dependencies]
embedded-graphics-simulator = "0.8.0"

[target.'cfg(target_arch = "arm")'.dependencies]
memmap2 = "0.9.11"
alsa = "0.12.1"
